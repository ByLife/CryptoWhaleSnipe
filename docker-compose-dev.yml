version: "3"
services:
  cryptowhalesnipe_dev:
    build: . # build from Dockerfile in current directory
    container_name: cryptowhalesnipe_dev
    ports:
      # map port 4000 on host to port 4000 in container
      - "4003:4000"
    environment:
      # set environment variables
      - NODE_ENV=staging
    restart: unless-stopped
networks:
  default:
    external:
      name: reverse-proxy
